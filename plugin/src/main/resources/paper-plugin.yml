name: Hexagon
version: '${version}'
main: io.github.pawelusze.hexagon.HexagonPlugin
loader: io.github.pawelusze.hexagon.HexagonLoader
api-version: '1.21'
description: Modern region protection for Paper.
authors: [Hexagon contributors]
dependencies:
  server:
    # FastAsyncWorldEdit declares "provides: WorldEdit", so it satisfies this too.
    WorldEdit:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
